<svg width="980" height="300" viewBox="0 0 980 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="980" height="300" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">The event loop's phases</text>

  <defs>
    <marker id="arrow-el" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- timers -->
  <rect x="20" y="70" width="150" height="60" rx="8" fill="#2563eb"/>
  <text x="95" y="96" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">timers</text>
  <text x="95" y="114" text-anchor="middle" font-size="11" fill="#dbeafe">setTimeout/Interval</text>

  <line x1="170" y1="100" x2="204" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-el)"/>

  <!-- pending callbacks -->
  <rect x="206" y="70" width="160" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="286" y="96" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">pending</text>
  <text x="286" y="114" text-anchor="middle" font-size="11" fill="#475569">deferred system callbacks</text>

  <line x1="366" y1="100" x2="400" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-el)"/>

  <!-- poll -->
  <rect x="402" y="70" width="150" height="60" rx="8" fill="#16a34a"/>
  <text x="477" y="96" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">poll</text>
  <text x="477" y="114" text-anchor="middle" font-size="11" fill="#dcfce7">I/O callbacks</text>

  <line x1="552" y1="100" x2="586" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-el)"/>

  <!-- check -->
  <rect x="588" y="70" width="150" height="60" rx="8" fill="#7c3aed"/>
  <text x="663" y="96" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">check</text>
  <text x="663" y="114" text-anchor="middle" font-size="11" fill="#ede9fe">setImmediate</text>

  <line x1="738" y1="100" x2="772" y2="100" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-el)"/>

  <!-- close -->
  <rect x="774" y="70" width="180" height="60" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="864" y="96" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">close callbacks</text>
  <text x="864" y="114" text-anchor="middle" font-size="11" fill="#475569">e.g. socket.on('close')</text>

  <!-- loop back -->
  <path d="M 864 132 C 864 200, 95 200, 95 132" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-el)"/>
  <text x="490" y="196" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">...and back to timers, for as long as work remains.</text>

  <!-- microtask banner -->
  <rect x="20" y="222" width="940" height="58" rx="10" fill="#fef3c7" stroke="#d97706"/>
  <text x="490" y="245" text-anchor="middle" font-size="13" fill="#78350f" font-weight="bold">Between EVERY callback — not just between phases:</text>
  <text x="490" y="264" text-anchor="middle" font-size="13" fill="#78350f">process.nextTick() drains fully, then all Promise callbacks drain fully, before Node moves on.</text>
</svg>
