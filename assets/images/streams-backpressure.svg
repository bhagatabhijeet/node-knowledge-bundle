<svg width="980" height="280" viewBox="0 0 980 280" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="980" height="280" fill="#ffffff"/>
  <text x="490" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Backpressure: pipe() keeping a fast source from drowning a slow destination</text>

  <defs>
    <marker id="arrow-bp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Readable -->
  <rect x="30" y="80" width="180" height="70" rx="10" fill="#16a34a"/>
  <text x="120" y="110" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">Readable</text>
  <text x="120" y="130" text-anchor="middle" font-size="12" fill="#dcfce7">fast (e.g. network)</text>

  <line x1="210" y1="115" x2="270" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-bp)"/>

  <!-- Buffer -->
  <rect x="272" y="70" width="220" height="90" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="382" y="92" text-anchor="middle" font-size="13" fill="#1e293b" font-weight="bold">Writable's internal buffer</text>
  <rect x="292" y="105" width="180" height="35" rx="4" fill="#fde68a" stroke="#d97706"/>
  <rect x="292" y="105" width="130" height="35" rx="4" fill="#f59e0b"/>
  <text x="382" y="128" text-anchor="middle" font-size="11" fill="#78350f" font-weight="bold">filling up...</text>

  <line x1="494" y1="115" x2="554" y2="115" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-bp)"/>

  <!-- Writable -->
  <rect x="556" y="80" width="180" height="70" rx="10" fill="#2563eb"/>
  <text x="646" y="110" text-anchor="middle" font-size="14" fill="#ffffff" font-weight="bold">Writable</text>
  <text x="646" y="130" text-anchor="middle" font-size="12" fill="#dbeafe">slow (e.g. disk)</text>

  <!-- pause path -->
  <path d="M 382 160 C 382 200, 120 200, 120 152" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-bp)"/>
  <text x="250" y="215" text-anchor="middle" font-size="12" fill="#dc2626" font-weight="bold">buffer full → .pipe() pauses the readable</text>

  <!-- drain path -->
  <path d="M 646 152 C 646 245, 382 245, 382 162" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-bp)"/>
  <text x="700" y="230" text-anchor="middle" font-size="12" fill="#16a34a" font-weight="bold">buffer drains → 'drain' event resumes it</text>

  <text x="490" y="272" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Without this loop, an unbounded amount of data would pile up in memory.</text>
</svg>
