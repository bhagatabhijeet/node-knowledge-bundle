<svg width="960" height="320" viewBox="0 0 960 320" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="320" fill="#ffffff"/>
  <text x="480" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Non-blocking (asynchronous) architecture</text>

  <defs>
    <marker id="arrow-nb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Step 1 -->
  <rect x="20" y="60" width="150" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="95" y="83" text-anchor="middle" font-size="13" fill="#1e293b">Request</text>
  <text x="95" y="101" text-anchor="middle" font-size="13" fill="#1e293b">arrives</text>

  <line x1="170" y1="87" x2="210" y2="87" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-nb)"/>

  <!-- Step 2 -->
  <rect x="212" y="60" width="150" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="287" y="83" text-anchor="middle" font-size="13" fill="#1e293b">Single thread</text>
  <text x="287" y="101" text-anchor="middle" font-size="13" fill="#1e293b">starts the work</text>

  <line x1="362" y1="87" x2="402" y2="87" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-nb)"/>

  <!-- Step 3: hand off -->
  <rect x="404" y="60" width="180" height="55" rx="8" fill="#16a34a"/>
  <text x="494" y="83" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Needs the database?</text>
  <text x="494" y="101" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Hand the wait off</text>

  <!-- branch down-left: thread freed -->
  <line x1="450" y1="115" x2="200" y2="165" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-nb)"/>
  <rect x="30" y="167" width="220" height="55" rx="8" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="140" y="190" text-anchor="middle" font-size="13" fill="#1e293b">Thread is freed instantly —</text>
  <text x="140" y="208" text-anchor="middle" font-size="13" fill="#1e293b">goes to serve another request</text>
  <path d="M 140 222 C 140 250, 95 250, 95 117" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-nb)"/>
  <text x="30" y="255" font-size="11" fill="#64748b" font-style="italic">(repeats for every new request)</text>

  <!-- branch down-right: I/O completes later -->
  <line x1="540" y1="115" x2="630" y2="165" stroke="#64748b" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrow-nb)"/>
  <rect x="530" y="167" width="210" height="55" rx="8" fill="#2563eb"/>
  <text x="635" y="190" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">...later: database replies,</text>
  <text x="635" y="208" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">result placed on the event queue</text>

  <line x1="740" y1="194" x2="782" y2="194" stroke="#64748b" stroke-width="2" marker-end="url(#arrow-nb)"/>

  <rect x="784" y="167" width="160" height="55" rx="8" fill="#7c3aed"/>
  <text x="864" y="190" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">Thread picks it up,</text>
  <text x="864" y="208" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="bold">resumes the response</text>

  <text x="480" y="300" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">One thread, never idle: it works on whatever is ready, in whatever order results arrive.</text>
</svg>
