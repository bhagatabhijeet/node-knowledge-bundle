<svg width="960" height="240" viewBox="0 0 960 240" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="240" fill="#ffffff"/>
  <text x="480" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">A release line's life: roughly 30 months from Current to EOL</text>

  <!-- segments -->
  <rect x="40" y="80" width="130" height="60" fill="#93c5fd" stroke="#ffffff" stroke-width="2"/>
  <text x="105" y="105" text-anchor="middle" font-size="13" fill="#1e3a8a" font-weight="bold">Current</text>
  <text x="105" y="123" text-anchor="middle" font-size="11" fill="#1e3a8a">~6 months</text>

  <rect x="170" y="80" width="290" height="60" fill="#4ade80" stroke="#ffffff" stroke-width="2"/>
  <text x="315" y="105" text-anchor="middle" font-size="13" fill="#14532d" font-weight="bold">Active LTS</text>
  <text x="315" y="123" text-anchor="middle" font-size="11" fill="#14532d">recommended for production</text>

  <rect x="460" y="80" width="290" height="60" fill="#fcd34d" stroke="#ffffff" stroke-width="2"/>
  <text x="605" y="105" text-anchor="middle" font-size="13" fill="#78350f" font-weight="bold">Maintenance LTS</text>
  <text x="605" y="123" text-anchor="middle" font-size="11" fill="#78350f">critical fixes only</text>

  <rect x="750" y="80" width="170" height="60" fill="#cbd5e1" stroke="#ffffff" stroke-width="2"/>
  <text x="835" y="105" text-anchor="middle" font-size="13" fill="#334155" font-weight="bold">EOL</text>
  <text x="835" y="123" text-anchor="middle" font-size="11" fill="#334155">no more updates</text>

  <!-- arrow -->
  <line x1="40" y1="160" x2="920" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <text x="40" y="180" font-size="12" fill="#64748b">release</text>
  <text x="920" y="180" text-anchor="end" font-size="12" fill="#64748b">~30 months later</text>

  <text x="480" y="216" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Only even-numbered majors (18, 20, 22, 24...) ever become LTS -- odd majors stop at Current.</text>
</svg>
