<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="260" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">How much of the version line each range covers, from 1.2.3</text>

  <!-- axis -->
  <line x1="120" y1="200" x2="820" y2="200" stroke="#94a3b8" stroke-width="2"/>
  <line x1="120" y1="194" x2="120" y2="206" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="194" x2="260" y2="206" stroke="#94a3b8" stroke-width="2"/>
  <line x1="820" y1="194" x2="820" y2="206" stroke="#94a3b8" stroke-width="2"/>
  <text x="120" y="222" text-anchor="middle" font-size="12" fill="#475569">1.2.3</text>
  <text x="260" y="222" text-anchor="middle" font-size="12" fill="#475569">1.3.0</text>
  <text x="820" y="222" text-anchor="middle" font-size="12" fill="#475569">2.0.0</text>

  <!-- ~1.2.3 bar -->
  <text x="60" y="106" text-anchor="end" font-size="14" font-weight="bold" fill="#2563eb">~1.2.3</text>
  <text x="190" y="80" text-anchor="middle" font-size="12" fill="#2563eb">patch releases only</text>
  <rect x="120" y="90" width="140" height="28" rx="6" fill="#2563eb"/>
  <circle cx="120" cy="104" r="5" fill="#2563eb"/>
  <circle cx="260" cy="104" r="5" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>

  <!-- ^1.2.3 bar -->
  <text x="60" y="166" text-anchor="end" font-size="14" font-weight="bold" fill="#16a34a">^1.2.3</text>
  <text x="470" y="145" text-anchor="middle" font-size="12" fill="#16a34a">everything up to (but not including) 2.0.0</text>
  <rect x="120" y="150" width="700" height="28" rx="6" fill="#16a34a"/>
  <circle cx="120" cy="164" r="5" fill="#16a34a"/>
  <circle cx="820" cy="164" r="5" fill="#ffffff" stroke="#16a34a" stroke-width="2"/>

  <text x="450" y="248" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Both start at 1.2.3 (inclusive); the open circle marks the exclusive upper bound.</text>
</svg>
