<svg width="960" height="300" viewBox="0 0 960 300" xmlns="http://www.w3.org/2000/svg" font-family="Arial, Helvetica, sans-serif">
  <rect width="960" height="300" fill="#ffffff"/>
  <text x="480" y="30" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">Resident memory under steady load: healthy vs. leaking</text>

  <!-- Healthy chart -->
  <text x="230" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#16a34a">Healthy: returns to the same baseline</text>
  <line x1="40" y1="230" x2="420" y2="230" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="80" x2="40" y2="230" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="40" y1="200" x2="420" y2="200" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <polyline points="40,200 110,120 115,200 185,120 190,200 260,120 265,200 335,120 340,200 400,120"
            fill="none" stroke="#16a34a" stroke-width="3" stroke-linejoin="round"/>
  <text x="230" y="255" text-anchor="middle" font-size="11" fill="#64748b">time, under constant load</text>

  <!-- Leak chart -->
  <text x="730" y="60" text-anchor="middle" font-size="14" font-weight="bold" fill="#dc2626">Leaking: baseline keeps climbing</text>
  <line x1="540" y1="230" x2="920" y2="230" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="540" y1="80" x2="540" y2="230" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="555" y1="200" x2="895" y2="110" stroke="#dc2626" stroke-width="1" stroke-dasharray="4,3"/>
  <polyline points="540,200 610,120 615,200 685,105 690,175 760,90 765,150 835,75 840,125 895,60"
            fill="none" stroke="#dc2626" stroke-width="3" stroke-linejoin="round"/>
  <text x="730" y="255" text-anchor="middle" font-size="11" fill="#64748b">time, under constant load</text>

  <text x="480" y="284" text-anchor="middle" font-size="12" fill="#64748b" font-style="italic">Each dip is a GC pass -- what matters is whether the floor after GC stays flat or keeps rising.</text>
</svg>
